<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HUB Дальнобоя | 3D Стоянка</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-canvas"></div>
<div id="ui-layer"></div>
<!-- Экран авторизации (адаптивный под смартфоны, планшеты и ПК) -->
<div id="login-screen">
<div class="glass-panel login-box">
<h1 class="text-sm font-black text-center mb-1 text-white uppercase">Кафе "15 Канал"</h1>
<p class="text-center text-amber-400 text-[11px] font-bold mb-2">Мультиплеер Хаб (Все устройства)</p>
<div class="space-y-2 text-xs font-bold w-full">
<div>
<label class="block text-gray-300 mb-1 uppercase text-[9px]">Позывной</label>
<input type="text" id="custName" value="Водитель" class="w-full bg-black/50 border border-white/20 rounded-lg px-2.5 py-1.5 text-white outline-none text-xs">
</div>
<div class="flex gap-2">
<div class="flex-1">
<label class="block text-gray-300 mb-1 uppercase text-[9px]">Куртка</label>
<input type="color" id="custShirtColor" value="#ea580c" class="w-full h-7 rounded-lg border border-white/20 bg-black cursor-pointer">
</div>
<div class="flex-1">
<label class="block text-gray-300 mb-1 uppercase text-[9px]">Волосы</label>
<input type="color" id="custHairColor" value="#1f2937" class="w-full h-7 rounded-lg border border-white/20 bg-black cursor-pointer">
</div>
</div>
</div>
<button id="startGameBtn" class="btn-tangent w-full mt-3 py-2.5 rounded-xl text-xs block interactive">
Ворваться на стоянку
</button>
<p class="text-[9px] text-gray-400 text-center mt-2">ПК: WASD/Стрелки + Мышь | Планшет/Смартфон: Джойстики</p>
</div>
</div>
<!-- Игровой интерфейс -->
<div id="game-ui">
<div class="absolute top-2 left-2 flex gap-2 z-30">
<div class="glass-panel px-2.5 py-1 rounded-lg font-bold text-amber-400 text-[11px] flex items-center gap-1.5">
<div class="w-2 h-2 bg-amber-400 rounded-full animate-pulse"></div> Рация онлайн
</div>
<button id="exit-btn" class="interactive glass-panel px-2.5 py-1 rounded-lg font-bold text-white text-[11px]">🚪 Выйти</button>
</div>
<div class="absolute top-2 right-2 z-30">
<div class="glass-panel px-2.5 py-1 rounded-lg font-bold text-emerald-400 text-[11px]">🟢 В сети: 4</div>
</div>
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[94%] max-w-sm flex gap-2 z-30 items-center">
<button id="mic-btn" class="interactive glass-panel text-red-500 p-2.5 rounded-xl shrink-0 flex items-center justify-center transition-all border border-red-500/30">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
</button>
<div class="flex-1 glass-panel rounded-xl flex items-center px-2.5 py-1">
<input type="text" id="chatInput" class="interactive w-full bg-transparent text-white text-[11px] font-bold py-1 outline-none placeholder-gray-400" placeholder="Сказать в эфир...">
<button id="send-btn" class="interactive text-amber-400 p-1.5 shrink-0">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
</button>
</div>
</div>
</div>
<!-- Зоны джойстиков для тач-устройств -->
<div id="zone-left" class="joystick-zone"><div class="joystick-base" id="joy-left"><div class="joystick-knob"></div></div></div>
<div id="zone-right" class="joystick-zone"><div class="joystick-base" id="joy-right"><div class="joystick-knob"></div></div></div>
<script src="game.js"></script>
</body>
</html>
